name: backfill

# One-off source ingestion. The news pool is filled daily by post.yml; the
# preprint and creative pools are backfills you run when their lists change.

on:
  workflow_dispatch:
    inputs:
      pool:
        description: Which pool to ingest
        required: true
        type: choice
        default: preprint
        options: [preprint, creative, news]

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r writer/requirements.txt
      - run: python sources.py --pool ${{ inputs.pool }}
        working-directory: writer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
